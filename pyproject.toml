[project]
name = "diff-gpt"
version = "0.32.0"
description = "Autoregressive GPT for time-series forecasting with MASH Σ-Δ derivative tokenization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "typing-extensions>=4.16.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff.lint]
# Strictest stable set: every rule.
select = ["ALL"]
ignore = [
    # Mutually exclusive pairs: keep D211 (no blank line before a class
    # docstring), since `ruff format` deletes that line, and D213 (multi-line
    # summary on the second line), which the code follows.
    "D203",
    "D212",
    # Naming: math-style tensor names (B, T, C) and torch aliases (F, DDP).
    "N",
    # Complexity limits: transformer code is argument- and branch-heavy.
    "C90",
    "PLR09",
    "PLR1702",
    # print is the output of the benchmark scripts.
    "T20",
    # Trailing commas are the formatter's job; ruff warns that COM812
    # conflicts with `ruff format`.
    "COM812",
    # No copyright header in each file: the license is in LICENSE.txt.
    "CPY",
]

[tool.ruff.lint.per-file-ignores]
# pytest checks with bare assert.
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true
