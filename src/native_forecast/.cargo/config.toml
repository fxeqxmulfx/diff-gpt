# The pipeline runs on this machine's Xeon E5-2680 v4: AVX2 and FMA, the level
# Kernite's x86 kernels need as well. Floating-point results do not depend on
# it: Rust neither contracts products into FMA nor reorders sums.
[build]
rustflags = ["-C", "target-cpu=x86-64-v3"]
rustdocflags = ["-C", "target-cpu=x86-64-v3"]
