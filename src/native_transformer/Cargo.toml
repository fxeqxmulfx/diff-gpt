[package]
name = "diff-gpt-kernite"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["codec"]

[workspace.metadata.kernite]
name = "diff_gpt_native"

[dependencies]
kernite-cuda = { path = "../../../../rust_projects/kgen/crates/cuda" }
kernite-macros = { path = "../../../../rust_projects/kgen/crates/macros" }
diffgpt-mash-native = { path = "codec" }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.11.1"

[profile.release]
codegen-units = 1
lto = "thin"
