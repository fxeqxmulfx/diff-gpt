# The port map: where each part of the frozen Python reference goes in the
# Rust workspace, which port task brings it over, and how its outputs are
# checked against the reference's. The harness reads it (src/port_map.rs),
# and its test (tests/port_map.rs) checks it whole against the reference's
# commit. A port task that finds an entry wrong changes it here, in a commit
# that says why.
#
# [modules]      each module of the reference's package, keyed by its path in
#                the package: its crate, its Rust module ("lib" for the
#                crate's root), its port task and its check. `others` is the
#                check on the backends other than LibTorch, `command` the
#                subcommand of the `diff-gpt` binary that a command line
#                becomes, `also` the task that ports the rest of a module,
#                `note` what an entry needs said.
# [data]         each other file of the package: its place in the workspace,
#                its port task and its check, `also` and `note` as above.
# [tempopfn]     each module of the TempoPFN clone that the corpus imports.
# [rust_only]    the Rust modules with no module of the reference.
# [tests]        each test file of the reference, keyed by its path in the
#                repository: the Rust test file that its ids go to, their port
#                task and check, the ids, the slow ones, the dropped ones with
#                their reasons (`drop`), and the ids that go elsewhere
#                (`overrides`). A `drop` or `overrides` key is an id or a test
#                function, whose cases it all covers. The Rust test of the id
#                `test_NAME[CASE]` is the test NAME of the file, and CASE the
#                case of it that pytest labels so; a slow test is
#                `#[ignore = "slow"]`, run by `cargo test -- --ignored`.
# [test_support] the other files of the reference's tests.
#
# The map covers the reference: its package, its tests and the modules of
# TempoPFN that the corpus imports. The repository's other files (README.md,
# the plans, runs/*.sh, lean/, pyproject.toml, uv.lock) are #36's, as the
# board says, with the removal of the Python.
#
# A check is how the Rust outputs are compared with the reference's
# ([checks]); a test's check is the kind of comparison its assertions make,
# which its port asserts as the pytest does, with the pytest's tolerances,
# and with the map's tolerance where another backend than LibTorch computes
# the numbers.

[reference]
commit = "5afe1a1"
package = "src/diff_gpt"
tests = "tests"
# `pytest --collect-only -q tests` at the commit: "927 tests collected";
# with `-m slow`, 19 of them.
pytest_ids = 927

[tasks]
27 = "Rust port 1: Cargo workspace on burn in clean architecture, strict lints, burn backends measured here, the port map"
28 = "Rust port 2: the frozen Python reference and the comparison harness in Rust"
29 = "Rust port 3: the domain without the model: the MASH Σ-Δ tokenizer, normalization, metrics, a numpy-compatible RNG"
30 = "Rust port 4: the model on burn: GPT, KV cache and engine, samplers, ScheduleFreeAdamW, the Python checkpoints"
31 = "Rust port 5: training: the data loaders, train, synthetic_pretrain with resume and kept checkpoints, NUMA pinning, the two-socket path"
32 = "Rust port 6: forecasting and benchmarks: predict_samples_many, synthetic_rescore, the GIFT forecast, M4, ETT, diff_bench, the anomaly demo"
33 = "Rust port 7: evaluation: GIFT-Eval and TIME export, score, aggregate and official, with the copies of gift-eval, timebench, gluonts, statsforecast and utilsforecast"
34 = "Rust port 8: the corpus: TempoPFN's 14 generators and 2 augmentations, the stand-ins, schedule, generate, export and stats"
35 = "Rust port 9: the research code: grokking (div97, mqar_div97, recurrence, series) and mqar, with their reports"
36 = "Rust port 10: done: every command and document on Rust, Python removed, the full sweep"

[checks]
exact = "bit for bit: the same tokens, integers, strings, bytes and files, and floats of the same bits"
ulp = "ulp:N: every float within N units in the last place of the reference's"
tolerance = "tolerance:NAME: every float within the tolerance NAME of [tolerances], |rust - reference| <= atol + rtol * |reference|"
distribution = "distribution:NAME: sampled outputs, by the test NAME of [distributions]"
none = "nothing of its own to compare: a package's docs, re-exports or import set-up, whose modules' checks cover it"

[tolerances]
f32_rounding = { rtol = 1.3e-6, atol = 1e-5, note = "float32 rounding: torch.testing.assert_close's default for float32, the reference's float32 operations in another order" }
backend = { rtol = 1e-4, atol = 1e-5, note = "the model on a backend other than LibTorch: other kernels, other orders of reduction" }
train = { rtol = 1e-3, atol = 1e-5, note = "the numbers of a short training run from the reference's initial weights: the losses of each step, the holdout's CRPS and MASE" }

[distributions]
frequencies = "draws of tokens: their counts against the sampler's probabilities, a chi-squared test at p >= 0.001 over at least 10^4 draws"
seeds = "sampled series and forecasts: their moments, autocorrelation, spectra and scores (CRPS, MASE) within the spread of two seeds of the reference"

