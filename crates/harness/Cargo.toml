[package]
name = "diff-gpt-harness"
description = "The port's tools: the layer rule, the port map, and the comparison of the Rust commands with the frozen Python reference."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The bench of burn's backends (`src/bin/backends.rs`). It compiles every
# backend in, LibTorch among them, so it needs the libtorch that
# `.cargo/config.toml` names; the default build compiles none.
backends = [
    "dep:burn",
    "burn/autodiff",
    "burn/autotune",
    "burn/cuda",
    "burn/flex",
    "burn/fusion",
    "burn/ndarray",
    "burn/rayon",
    "burn/simd",
    "burn/tch",
]

[dependencies]
burn = { workspace = true, optional = true }
cargo_metadata.workspace = true
proc-macro2.workspace = true
serde.workspace = true
syn.workspace = true
toml.workspace = true

[[bin]]
name = "backends"
required-features = ["backends"]

[lints]
workspace = true
