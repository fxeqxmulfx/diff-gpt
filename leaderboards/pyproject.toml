[project]
name = "leaderboards"
version = "0.1.0"
description = "GIFT-Eval adapter for diff-gpt: export windows, score forecasts, aggregate"
requires-python = "==3.11.*"
dependencies = [
    "salesforce-gift-eval",
    "gluonts~=0.15.1",
    "numpy~=1.26.0",
    "pandas>=2.0.0",
    # pyarrow 26 needs NumPy 2; gift-eval pins NumPy 1.26.
    "pyarrow>=12,<26",
    "statsforecast>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
# gift-eval at the commit read on 2026-10-21 (the leaderboard's code path).
salesforce-gift-eval = { git = "https://github.com/SalesforceAIResearch/gift-eval", rev = "3c7be6deffb0046e1c08f9103db8bc84b3cf7ebd" }

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
extend = "../pyproject.toml"
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.extend-per-file-ignores]
# pytest checks with bare assert, as the root's tests/ do; the root's
# "tests/**" pattern is relative to the root.
"tests/**" = ["S101"]
