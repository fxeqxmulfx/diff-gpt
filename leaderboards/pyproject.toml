[project]
name = "leaderboards"
version = "0.1.0"
description = "GIFT-Eval and TIME adapters for diff-gpt: export windows, score forecasts, aggregate"
requires-python = ">=3.14"
dependencies = [
    "datasets>=2.17.1",
    "numpy>=1.26.0",
    # The gluonts copy's norm_freq_str writes the "E" codes of pandas 2.2.
    "pandas>=2.2.0",
    "pyarrow>=12",
    "pyyaml>=6.0",
    "scipy>=1.11.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
extend = "../pyproject.toml"
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.extend-per-file-ignores]
# pytest checks with bare assert, as the root's tests/ do; the root's
# "tests/**" pattern is relative to the root.
"tests/**" = ["S101"]
